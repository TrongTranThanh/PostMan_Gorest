name: Production Monitor

on:
  schedule:
    - cron: '0 * * * *'  # Tự động kiểm tra mỗi 1 giờ
  workflow_dispatch:      # Cho phép bấm chạy bằng tay trên giao diện

jobs:
  monitor-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Đăng nhập Postman
        run: postman login --with-api-key ${{ secrets.Gorest_key }}

      - name: Chạy kịch bản Monitor trực tiếp từ Cloud
        run: postman collection run "59052422-c6625421-43bc-4330-a69d-5c2a7222e36d"
